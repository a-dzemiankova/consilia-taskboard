{% extends 'base.html' %}

{% block content %}
  <h2>Deleting "{{ task.title }}"</h2>
  <p>Are you sure you want to delete this task?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit">Yes, delete</button>
    <a href="{% url 'task_details' pk=task.pk %}">Cancel</a>
  </form>
{% endblock %}
